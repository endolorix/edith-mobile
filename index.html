<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#020507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Édith">
  <title>Édith</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/edith-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">ÉDITH<small>PERSONAL INTELLIGENCE</small></div>
      <div class="badge"><i></i><span>PRÊTE</span></div>
    </header>

    <main>
      <div class="stage-label">À TON ÉCOUTE, AMINE</div>
      <canvas id="orb" aria-label="Sphère holographique Édith"></canvas>
    </main>

    <section class="bottom">
      <button id="talk" class="talk" aria-label="Parler à Édith">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v4M8 22h8"/></svg>
      </button>
      <div class="status">Prête quand tu l’es.</div>
      <div class="hint">Touchez le micro pour ouvrir ChatGPT et lancer le vocal.</div>
      <button id="chat" class="secondary">Ouvrir ChatGPT</button>
      <button id="install" class="secondary install">Installer Édith sur l’iPhone</button>
    </section>

    <div class="corners"><span>ÉDITH / MOBILE</span><span>V1 · iOS</span></div>
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card">
        <h2>Installer Édith</h2>
        <p>Dans Safari : bouton Partager → <b>Sur l’écran d’accueil</b> → Ajouter.</p>
        <p>Édith s’ouvrira ensuite en plein écran comme une app.</p>
        <button id="closeSheet">Compris</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
